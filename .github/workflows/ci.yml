name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Build Rust backend
        run: cargo build --release --manifest-path codesleuth/Cargo.toml
      - name: Test Rust
        run: cargo test --manifest-path codesleuth/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path codesleuth/Cargo.toml --all-targets -- -D warnings
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Test Go
        run: go test ./...
      - name: Vet Go
        run: go vet ./...
      - name: Build Go CLI
        run: cd cmd && go build -o codesleuth
      - name: Smoke analyze
        run: |
          mkdir -p smoke
          cat > smoke/hello.cob << 'EOF'
                 IDENTIFICATION DIVISION.
                 PROGRAM-ID. HELLO.
                 DATA DIVISION.
                 WORKING-STORAGE SECTION.
                 77  WHO PIC X(15).
                 PROCEDURE DIVISION.
                     DISPLAY 'HELLO WORLD!'.
                     GOBACK.
          EOF
          ./cmd/codesleuth --rust-backend ./codesleuth/target/release/codesleuth analyze smoke
