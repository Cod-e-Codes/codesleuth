name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Test
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Release build
        run: cargo build --release

  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Release build
        run: cargo build --release
      - name: Clone COBOL Programming Course
        uses: actions/checkout@v4
        with:
          repository: openmainframeproject/cobol-programming-course
          ref: 1f037d24326124f4f2c5cd2d31e5220ceb549580
          path: corpus
      - name: Analyze labs
        run: ./target/release/codesleuth analyze corpus --workers 4 --output reports-ci
      - name: Benchmark labs
        run: ./target/release/codesleuth analyze corpus --workers 4 --benchmark --output reports-ci-bench
