[package]
name = "codesleuth"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Parse COBOL and write Markdown summaries"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.7"
once_cell = "1.17"
clap = { version = "4.4", features = ["derive"] }
thiserror = "2.0"
